name: "🐞 Script Issue Report"
description: Report a specific issue with a script. For other inquiries, please use the Discussions section.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ **IMPORTANT - READ FIRST**  
        - 🔍 **Search first:** Before submitting, check if the issue has already been reported or resolved in [closed issues](https://github.com/community-scripts/ProxmoxVE/issues?q=is%3Aissue+is%3Aclosed). If found, comment on that issue instead of creating a new one.  
        Alternatively, check the **[Discussions](https://github.com/community-scripts/ProxmoxVE/discussions)** under the *"Announcement"* or *"Guide"* categories for relevant information.  
        - 🔎 If you encounter `[ERROR] in line 23: exit code *: while executing command "$@" > /dev/null 2>&1`, rerun the script with verbose mode before submitting the issue.  
        - 📜 **Read the script:** Familiarize yourself with the script's content and its purpose. This will help you understand the issue better and provide more relevant information

        Thank you for taking the time to report an issue! Please provide as much detail as possible to help us address the problem efficiently.  

     
  - type: input
    id: guidelines
    attributes:
      label: ✅ Have you read and understood the above guidelines?
      placeholder: "yes"
    validations:
      required: true

  - type: dropdown
    id: verbose_run
    attributes:
      label: 🔎 Did you run the script with verbose mode enabled?
      description: "Required for debugging any script issue. A verbose log is mandatory."
      options:
        - "Yes, verbose mode was enabled and the output is included below"
        - "No (this issue will likely be closed automatically)"
    validations:
      required: true

  - type: input
    id: script_name
    attributes:
      label: 📜 What is the name of the script you are using?
      placeholder: "e.g., NextcloudPi, Zigbee2MQTT"
    validations:
      required: true

  - type: input
    id: script_command
    attributes:
      label: 📂 What was the exact command used to execute the script?
      placeholder: "e.g., bash -c \"$(curl -fsSL https://raw.githubusercontent.com/community-scripts/ProxmoxVE/main/ct/zigbee2mqtt.sh)\" or \"update\""
    validations:
      required: true

  - type: dropdown
    id: issue_phase
    attributes:
      label: 🕒 When does the issue occur?
      options:
        - "Initial creation / installation"
        - "Update of an existing container"
        - "While the application is running"
    validations:
      required: true

  - type: dropdown
    id: execution_context
    attributes:
      label: 🖱️ Where did you run the command?
      description: "The shell matters — the Proxmox web console starts without some environment variables that a normal login shell sets."
      options:
        - "Proxmox web UI → node → Shell"
        - "Proxmox web UI → LXC → Console"
        - "SSH into the Proxmox host"
        - "SSH into the container"
        - "pct enter from the host"
        - "Other / not listed"
    validations:
      required: true

  - type: checkboxes
    validations:
      required: true
    attributes:
      label: ⚙️ What settings are you using?
      options:
        - label: Default Settings
        - label: Advanced Settings

  - type: markdown
    attributes:
      value: "💡 **Tip:** If you are using Advanced Settings, please test with Default Settings before submitting an issue."

  - type: dropdown
    id: linux_distribution
    attributes:
      label: 🖥️ Which Linux distribution are you using?
      options:
        - Alpine
        - Debian 12
        - Debian 13
        - Devuan 5
        - Ubuntu 22.04
        - Ubuntu 24.04
        - Ubuntu 25.04
        - AlmaLinux 9
        - AlmaLinux 10
        - Rocky Linux 9
        - Rocky Linux 10
        - CentOS Stream 9
        - Fedora 42
        - openSUSE 15
        - openEuler 25
        - Gentoo
        - Other / not listed
    validations:
      required: true

  - type: dropdown
    id: host_arm64
    attributes:
      label: 🧱 Is this Proxmox host running arm64?
      description: "Run `dpkg --print-architecture` on your Proxmox host if unsure."
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: dropdown
    id: pve_major
    attributes:
      label: 📈 Which Proxmox VE release are you on?
      options:
        - "Proxmox VE 9"
        - "Proxmox VE 8"
        - "Proxmox VE 7 or older (end of life)"
    validations:
      required: true

  - type: input
    id: pve_version
    attributes:
      label: 🔢 Exact Proxmox version and kernel
      description: "Both matter — several issues turned out to be kernel-specific."
      placeholder: "run pveversion in your PVE node console"
    validations:
      required: true

  - type: textarea
    id: issue_description
    attributes:
      label: 📝 Provide a clear and concise description of the issue.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: 🔄 Steps to reproduce the issue.
      placeholder: "e.g., Step 1: ..., Step 2: ..."
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: ❌ Paste the full error output (if available).
      placeholder: "Include any relevant logs or error messages."
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 🖼️ Additional context (optional).
      placeholder: "Include screenshots, code blocks (use triple backticks ```), or any other relevant information."
    validations:
      required: false
