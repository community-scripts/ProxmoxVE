name: PR test command

# Posts a ready-to-run test command for the scripts a PR touches. The workflow
# lives in community-scripts/ci (shared with DevScripts and ProxmoxVE); this
# file only holds the trigger. Nothing from the PR is checked out or run.

on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths:
      - "ct/**"
      - "install/**"
      - "vm/**"
      - "tools/**"
      - "turnkey/**"

permissions: {}

jobs:
  pr-test-command:
    permissions:
      pull-requests: write
      contents: read
    uses: community-scripts/ci/.github/workflows/pr-test-command.yml@main
