name: Create Changelog Pull Request

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Fired by community-scripts/core when an engine pull request is merged, so a
  # change there does not wait for the next push here. Optional: engine PRs are
  # collected on every run regardless, this only decides how soon.
  repository_dispatch:
    types: [core-pr-merged]

jobs:
  update-changelog-pull-request:
    if: github.repository == 'community-scripts/ProxmoxVE'
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: .github/changelog-pr-config.json
      BRANCH_NAME: github-action-update-changelog
      AUTOMATED_PR_LABEL: "automated pr"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GHAPP_PR_ID }}
          private-key: ${{ secrets.GHAPP_PR_PRIVATE_KEY }}

      - name: Generate a token for PR approval and merge
        id: generate-token-merge
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GHAPP_MERGEBOT_ID }}
          private-key: ${{ secrets.GHAPP_MERGEBOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest dates in changelog
        run: |
          DATES=$(grep -E '^## [0-9]{4}-[0-9]{2}-[0-9]{2}' CHANGELOG.md | head -n 2 | awk '{print $2}')

          LATEST_DATE=$(echo "$DATES" | sed -n '1p')
          SECOND_LATEST_DATE=$(echo "$DATES" | sed -n '2p')
          TODAY=$(date -u +%Y-%m-%d)

          echo "TODAY=$TODAY" >> $GITHUB_ENV
          if [[ "$LATEST_DATE" == "$TODAY" ]]; then
            echo "LATEST_DATE=$SECOND_LATEST_DATE" >> $GITHUB_ENV
          else
            echo "LATEST_DATE=$LATEST_DATE" >> $GITHUB_ENV
          fi

      - name: Get categorized pull requests
        id: get-categorized-prs
        uses: actions/github-script@v9
        with:
          script: |
            async function main() {
              const fs = require('fs').promises;
              const path = require('path');

              const configPath = path.resolve(process.env.CONFIG_PATH);
              const fileContent = await fs.readFile(configPath, 'utf-8');
              const changelogConfig = JSON.parse(fileContent);

              const categorizedPRs = changelogConfig.map(obj => ({
                ...obj,
                notes: [],
                subCategories: obj.subCategories ?? (
                  obj.labels.includes("update script") ? [
                    { title: "🐞 Bug Fixes", labels: ["bugfix"], notes: [] },
                    { title: "✨ New Features", labels: ["feature"], notes: [] },
                    { title: "💥 Breaking Changes", labels: ["breaking change"], notes: [] },
                    { title: "🔧 Refactor", labels: ["refactor"], notes: [] },
                  ] :
                  obj.labels.includes("maintenance") ? [
                    { title: "🐞 Bug Fixes", labels: ["bugfix"], notes: [] },
                    { title: "✨ New Features", labels: ["feature"], notes: [] },
                    { title: "💥 Breaking Changes", labels: ["breaking change"], notes: [] },
                    { title: "📡 API", labels: ["api"], notes: [] },
                    { title: "Github", labels: ["github"], notes: [] },
                    { title: "📝 Documentation", labels: ["maintenance"], notes: [] },
                    { title: "🔧 Refactor", labels: ["refactor"], notes: [] }
                  ] :
                  obj.labels.includes("website") ? [
                    { title: "🐞 Bug Fixes", labels: ["bugfix"], notes: [] },
                    { title: "✨ New Features", labels: ["feature"], notes: [] },
                    { title: "💥 Breaking Changes", labels: ["breaking change"], notes: [] },
                    { title: "Script Information", labels: ["json"], notes: [] }
                  ] : []
                )
              }));

              const latestDateInChangelog = new Date(process.env.LATEST_DATE);
              latestDateInChangelog.setUTCHours(23, 59, 59, 999);

              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: "ProxmoxVE",
                base: "main",
                state: "closed",
                sort: "updated",
                direction: "desc",
                per_page: 100,
              });

              const filteredPRs = pulls.filter(pr =>
                pr.merged_at &&
                new Date(pr.merged_at) > latestDateInChangelog &&
                !pr.labels.some(label =>
                  ["invalid", "wontdo", process.env.AUTOMATED_PR_LABEL].includes(label.name.toLowerCase())
                )
              );

              async function getScriptAuthors(pr) {
                try {
                  const { data: files } = await github.rest.pulls.listFiles({
                    owner: context.repo.owner,
                    repo: "ProxmoxVE",
                    pull_number: pr.number,
                    per_page: 100,
                  });
                  const ctFile = files.find(file => file.status === "added" && /^ct\/[^/]+\.sh$/.test(file.filename));
                  if (!ctFile) return "";

                  const { data: script } = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: "ProxmoxVE",
                    path: ctFile.filename,
                    ref: pr.merge_commit_sha,
                  });
                  const header = Buffer.from(script.content, "base64").toString("utf-8")
                    .split("\n").slice(0, 20)
                    .find(line => /^#\s*Authors?:/i.test(line));
                  if (!header) return "";

                  // "MickLesk (CanbiZ)" puts the handle first, "Slaviša Arežina (tremor021)" in the parentheses
                  const candidates = header.replace(/^#\s*Authors?:/i, "").split("|").map(part => {
                    part = part.trim().replace(/^[A-Za-z-]+:\s*/, "");
                    const match = part.match(/^([^(]*)\(([^)]*)\)/);
                    if (!match) return part;
                    const words = match[1].trim().split(/\s+/).filter(Boolean);
                    return words.length === 1 ? words[0] : match[2].trim();
                  });

                  // A display name used alone in a header; the GitHub account of that name is someone else
                  const authorAliases = { canbiz: "MickLesk" };
                  const logins = [];
                  for (let candidate of candidates) {
                    if (!/^[A-Za-z0-9-]+$/.test(candidate)) continue;
                    candidate = authorAliases[candidate.toLowerCase()] ?? candidate;
                    try {
                      const { data: user } = await github.rest.users.getByUsername({ username: candidate });
                      if (user.type === "User" && !logins.includes(user.login)) logins.push(user.login);
                    } catch (error) {
                      console.log(`No GitHub user ${candidate} (${ctFile.filename}): ${error}`);
                    }
                  }
                  return logins.map(login => `[@${login}](https://github.com/${login})`).join(", ");
                } catch (error) {
                  console.error(`Could not read the author of #${pr.number}: ${error}`);
                  return "";
                }
              }

              for (const pr of filteredPRs) {
                const prLabels = pr.labels.map(label => label.name.toLowerCase());
                const scriptAuthors = prLabels.includes("new script") ? await getScriptAuthors(pr) : "";
                if (scriptAuthors) {
                  prNote = `- ${pr.title} ${scriptAuthors} ([#${pr.number}](${pr.html_url}))`;
                } else if (pr.user.login.includes("push-app-to-main[bot]")) {

                  const scriptName = pr.title;
                    try {
                      const { data: relatedIssues } = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: "DevScripts",
                        state: "all",
                        labels: ["Started Migration To ProxmoxVE"],
                        per_page: 100,
                      });

                      const matchingIssue = relatedIssues.find(issue =>
                        issue.title.trim().toLowerCase() === scriptName.trim().toLowerCase()
                      );

                      if (matchingIssue) {
                        const issueAuthor = matchingIssue.user.login;
                        const issueAuthorUrl = `https://github.com/${issueAuthor}`;
                        prNote = `- ${pr.title} [@${issueAuthor}](${issueAuthorUrl}) ([#${pr.number}](${pr.html_url}))`;
                      }
                      else {
                        prNote = `- ${pr.title} ([#${pr.number}](${pr.html_url}))`;
                      }
                    } catch (error) {
                      console.error(`Error fetching related issues: ${error}`);
                      prNote = `- ${pr.title} ([#${pr.number}](${pr.html_url}))`;
                    }
                }else{
                  prNote = `- ${pr.title} [@${pr.user.login}](https://github.com/${pr.user.login}) ([#${pr.number}](${pr.html_url}))`;
                }


                if (prLabels.includes("new script")) {
                  const newScriptCategory = categorizedPRs.find(category =>
                  category.title === "New Scripts" || category.labels.includes("new script"));
                  if (newScriptCategory) {
                  newScriptCategory.notes.push(prNote);
                  }
                } else {

                  let categorized = false;
                  const priorityCategories = categorizedPRs.slice();
                  
                  // Priority order for content-type labels (highest priority first)
                  const subCategoryPriority = ["breaking change", "bugfix", "feature", "refactor"];
                  
                  for (const category of priorityCategories) {
                  if (categorized) break;
                  if (category.labels.some(label => prLabels.includes(label))) {
                    if (category.subCategories && category.subCategories.length > 0) {
                    // Find subcategory by priority order instead of first match
                    let subCategory = null;
                    for (const priorityLabel of subCategoryPriority) {
                      if (prLabels.includes(priorityLabel)) {
                        subCategory = category.subCategories.find(sub =>
                          sub.labels.includes(priorityLabel)
                        );
                        if (subCategory) break;
                      }
                    }
                    
                    // Fallback: check for any other subcategory match (api, github, json, etc.)
                    if (!subCategory) {
                      subCategory = category.subCategories.find(sub =>
                        sub.labels.some(label => prLabels.includes(label))
                      );
                    }

                    if (subCategory) {
                      subCategory.notes.push(prNote);
                    } else {
                      category.notes.push(prNote);
                    }
                    } else {
                    category.notes.push(prNote);
                    }
                    categorized = true;
                  }
                  }

                  // Fallback: Add to Uncategorized if no category matched
                  if (!categorized) {
                    const uncategorized = categorizedPRs.find(category =>
                      category.title.includes("Uncategorized") || category.labels.includes("needs triage"));
                    if (uncategorized) {
                      uncategorized.notes.push(prNote);
                    }
                  }
                }

              }

              // ── Pull requests from other repositories ───────────────────────
              const externalRepos = [
                { repo: "core", category: "💾 Core", prefix: "core" },
                { repo: "services", category: "🛰️ Services", prefix: "services" },
                { repo: "ProxmoxVE-Frontend", category: "🌐 Website", prefix: "website" },
              ];
              const externalLabelAliases = {
                bug: "bugfix",
                bugfix: "bugfix",
                enhancement: "feature",
                feature: "feature",
                refactor: "refactor",
                "breaking change": "breaking change",
              };
              const externalPriority = ["breaking change", "bugfix", "feature", "refactor"];

              for (const { repo, category: categoryTitle, prefix } of externalRepos) {
                try {
                  const { data: externalPulls } = await github.rest.pulls.list({
                    owner: context.repo.owner,
                    repo,
                    base: "main",
                    state: "closed",
                    sort: "updated",
                    direction: "desc",
                    per_page: 100,
                  });

                  const category = categorizedPRs.find(c => c.title === categoryTitle);

                  for (const pr of externalPulls) {
                    if (!pr.merged_at) continue;
                    if (new Date(pr.merged_at) <= latestDateInChangelog) continue;

                    const rawLabels = pr.labels.map(label => label.name.toLowerCase());
                    if (rawLabels.some(l => ["invalid", "wontdo", "wontfix", "duplicate", process.env.AUTOMATED_PR_LABEL].includes(l))) continue;

                    if (!category) {
                      console.log(`No ${categoryTitle} category configured; skipping ${prefix}#${pr.number}`);
                      continue;
                    }

                    // core#N rather than #N: a bare #N links to a pull request in this repository.
                    const note = `- ${pr.title} [@${pr.user.login}](https://github.com/${pr.user.login}) ([${prefix}#${pr.number}](${pr.html_url}))`;

                    const mapped = rawLabels.map(l => externalLabelAliases[l]).filter(Boolean);
                    let placed = false;
                    if (category.subCategories && category.subCategories.length > 0) {
                      for (const priorityLabel of externalPriority) {
                        if (!mapped.includes(priorityLabel)) continue;
                        const subCategory = category.subCategories.find(sub =>
                          sub.labels.includes(priorityLabel));
                        if (subCategory) {
                          subCategory.notes.push(note);
                          placed = true;
                          break;
                        }
                      }
                    }
                    if (!placed) category.notes.push(note);
                  }
                } catch (error) {
                  console.error(`Could not read ${repo} pull requests: ${error}`);
                }
              }

              return categorizedPRs;
            }

            return await main();

      - name: Update CHANGELOG.md
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs').promises;
            const path = require('path');

            const today = process.env.TODAY;
            const latestDateInChangelog = process.env.LATEST_DATE;
            const changelogPath = path.resolve('CHANGELOG.md');
            const categorizedPRs = ${{ steps.get-categorized-prs.outputs.result }};

            console.log(JSON.stringify(categorizedPRs, null, 2));


            let newReleaseNotes = `## ${today}\n\n`;
            for (const { title, notes, subCategories } of categorizedPRs) {
              const hasSubcategories = subCategories && subCategories.length > 0;
              const hasMainNotes = notes.length > 0;
              const hasSubNotes = hasSubcategories && subCategories.some(sub => sub.notes && sub.notes.length > 0);

              if (hasMainNotes || hasSubNotes) {
                newReleaseNotes += `### ${title}\n\n`;
              }

              if (hasMainNotes) {
                newReleaseNotes += `  ${notes.join("\n")}\n\n`;
              }
              if (hasSubcategories) {
                for (const { title: subTitle, notes: subNotes } of subCategories) {
                  if (subNotes && subNotes.length > 0) {
                    newReleaseNotes += `  - #### ${subTitle}\n\n`; 
                    newReleaseNotes += `    ${subNotes.join("\n    ")}\n\n`; 
                  }
                }
              }
            }        
            const changelogContent = await fs.readFile(changelogPath, 'utf-8');
            const changelogIncludesTodaysReleaseNotes = changelogContent.includes(`\n## ${today}`);

            const regex = changelogIncludesTodaysReleaseNotes 
              ? new RegExp(`## ${today}.*(?=## ${latestDateInChangelog})`, "gs") 
              : new RegExp(`(?=## ${latestDateInChangelog})`, "gs");

            const newChangelogContent = changelogContent.replace(regex, newReleaseNotes);
            await fs.writeFile(changelogPath, newChangelogContent);

      - name: Check for changes
        id: verify-diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_ENV

      - name: Commit and push changes
        if: env.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md"
          git checkout -b $BRANCH_NAME || git checkout $BRANCH_NAME
          git push origin $BRANCH_NAME --force
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create pull request if not exists
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          PR_EXISTS=$(gh pr list --head "${BRANCH_NAME}" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -z "$PR_EXISTS" ]; then
            gh pr create --title "[Github Action] Update CHANGELOG.md" \
                         --body "This PR is auto-generated by a Github Action to update the CHANGELOG.md file." \
                         --head $BRANCH_NAME \
                         --base main \
                         --label "$AUTOMATED_PR_LABEL"
          fi

      - name: Approve pull request
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head "${BRANCH_NAME}" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr review "$PR_NUMBER" --approve
          fi

      - name: Approve pull request and merge
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token-merge.outputs.token }}
        run: |
          git config --global user.name "github-actions-automege[bot]"
          git config --global user.email "github-actions-automege[bot]@users.noreply.github.com"
          PR_NUMBER=$(gh pr list --head "${BRANCH_NAME}" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr review "$PR_NUMBER" --approve
            gh pr merge "$PR_NUMBER" --squash --admin --match-head-commit "$HEAD_SHA"
          fi
