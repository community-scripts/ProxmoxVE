name: ARM script test (manual)

# Builds one ct/ script on GitHub's free arm64 runner, inside Incus. Started
# by hand from the Actions tab; the result is in the job summary and the
# artifact. The workflow lives in community-scripts/ci, shared with
# DevScripts/ProxmoxVE; this file is identical in both repositories.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "ct/ script, e.g. ct/bark-server.sh"
        required: true
        type: string
      ref:
        description: "Branch or full SHA of this repository"
        required: false
        default: main
        type: string

permissions: {}

jobs:
  arm-script-test:
    permissions:
      contents: read
    uses: community-scripts/ci/.github/workflows/arm-script-test.yml@main
    with:
      script: ${{ inputs.script }}
      ref: ${{ inputs.ref }}
